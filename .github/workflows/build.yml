name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Synthetic FFmpeg integration
    runs-on: ubuntu-24.04
    env:
      OMVTOOL_INTEGRATION: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ffmpeg
      - run: python -m pip install .
      - run: omvtool doctor
      - run: python -m unittest discover -s tests -v

  compatibility:
    name: Python 3.10 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  build:
    name: ${{ matrix.platform }}-${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            architecture: x64
          - os: windows-11-arm
            platform: windows
            architecture: arm64
          - os: macos-15-intel
            platform: macos
            architecture: x64
          - os: macos-latest
            platform: macos
            architecture: arm64
          - os: ubuntu-24.04
            platform: linux
            architecture: x64
          - os: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
          cache: pip
      - run: python -m pip install ".[build]"
      - run: python -m unittest discover -s tests -v\n        if: matrix.platform == 'linux'\n      - run: python scripts/build.py --architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v6
        with:
          name: omvtool-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release/*
          if-no-files-found: error

  source:
    name: Python wheel and source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - uses: actions/upload-artifact@v6
        with:
          name: omvtool-python
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, source, integration, compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate aggregate checksums
        shell: python {0}
        run: |
          import hashlib
          from pathlib import Path
          root = Path('release-assets')
          assets = sorted(p for p in root.iterdir() if p.is_file() and not p.name.endswith('.sha256'))
          assert len(assets) == 8, [p.name for p in assets]
          lines = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in assets]
          (root / 'SHA256SUMS').write_text(''.join(lines), encoding='ascii')
      - name: Publish release with all assets
        shell: bash
        run: |
          options=(--verify-tag --generate-notes --title "OMVTool $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* "${options[@]}"


